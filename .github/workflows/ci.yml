name: CI / Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality & Test Suite
  # ---------------------------------------------------------------------------
  analyze_and_test:
    name: Analyze & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

  # ---------------------------------------------------------------------------
  # 2. Android Build Job
  # ---------------------------------------------------------------------------
  build_android:
    name: Build Android APK
    needs: analyze_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: b2auth-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Web Build Job
  # ---------------------------------------------------------------------------
  build_web:
    name: Build Web App
    needs: analyze_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Application
        run: flutter build web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: b2auth-web-bundle
          path: build/web
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. macOS Build Job
  # ---------------------------------------------------------------------------
  build_macos:
    name: Build macOS Desktop
    needs: analyze_and_test
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Debug Binary
        run: flutter build macos --debug
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"

      - name: Zip macOS App for Artifact Upload
        run: |
          cd build/macos/Build/Products/Debug
          zip -r -y b2auth-macos.zip b2auth.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: b2auth-macos-debug-app
          path: build/macos/Build/Products/Debug/b2auth-macos.zip
          if-no-files-found: error
          retention-days: 14
